<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e293b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="案件進捗"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>案件進捗管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#1f2937;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:18px 14px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0}small,.muted{color:#64748b}button,input,select{font:inherit}button{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:10px 12px;cursor:pointer;color:#1e293b}button.primary{background:#24364c;color:white;border-color:#24364c}button.danger{color:#b91c1c}button:disabled{opacity:.45}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white;min-width:0}label{display:block;font-size:13px;color:#475569;margin:10px 0 5px}.card{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:14px;margin:10px 0}.selected{border:2px solid #334155}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}.stack{display:grid;gap:10px}.pill{display:inline-block;background:#f1f5f9;padding:4px 8px;border-radius:999px;font-size:12px;color:#475569}.wait{background:#fff3df;color:#975b06}.task{border-top:1px solid #edf0f4;padding:12px 0}.task:first-child{border-top:0}.taskname{display:flex;align-items:flex-start;gap:10px}.taskname input{width:20px;height:20px;margin:0;flex:none;accent-color:#256c56}.done{text-decoration:line-through;color:#64748b}.small{font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.controls>*{flex:1}.hidden{display:none!important}.share{background:white;padding:20px;border-radius:12px}.shareitem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #e2e8f0}.shareitem:last-child{border:0}.mark{font-size:19px;min-width:25px}.right{margin-left:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.toolbar button{flex:1}details{margin-top:14px}summary{cursor:pointer;color:#334155;font-weight:600} .status{font-size:12px;margin-top:4px}.message{font-size:13px;color:#475569;margin:8px 0}#shareView{display:none}@media(max-width:370px){button{padding:9px 8px;font-size:13px}h1{font-size:19px}}@media print{body{background:white}main{max-width:none;padding:0}#appView,#shareControls{display:none!important}#shareView{display:block!important}.share{border:0}}
</style></head><body><main><section id="appView"><header><div><h1>案件進捗管理</h1><small>品番ごとの作業ログ</small></div><button class="primary" id="addProject">＋ 案件追加</button></header><div class="card hidden" id="projectForm"><h2 id="projectFormTitle">新しい案件</h2><label>取引先・ブランド</label><input id="brand" autocomplete="off"><label>品番</label><input id="code" autocomplete="off"><label>案件名</label><input id="projectName" autocomplete="off"><div class="toolbar"><button id="cancelProject">キャンセル</button><button class="primary" id="saveProject">保存</button></div></div><div class="stack"><input id="search" placeholder="品番・案件名を検索"><select id="brandFilter" aria-label="ブランドで絞り込み"></select><select id="statusFilter" aria-label="作業状態で絞り込み"><option value="all">すべての状態</option><option value="mine">自分の作業あり</option><option value="waiting">相手待ちあり</option></select></div><div id="projects"></div><details class="card"><summary>バックアップ・復元</summary><p class="message">データはこの端末のブラウザ内に保存されます。端末変更やSafariのデータ削除に備えて、定期的にバックアップしてください。</p><div class="stack"><button id="export">JSONバックアップを書き出す</button><label>バックアップを復元（現在のデータを置き換えます）</label><input id="import" type="file" accept="application/json,.json"></div></details><p class="message" id="saveMessage">この端末に自動保存します。</p></section><section id="shareView"><div class="toolbar" id="shareControls"><button id="back">← 管理画面に戻る</button></div><div class="share" id="shareContent"></div></section></main><script>
'use strict';const KEY='apparel-progress-v1';let state={projects:[]},selected=null,sharing=null,editProject=null,editTask=null;const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nowLocal=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};const fmt=s=>s?String(s).replace('T',' ').replaceAll('-','/'):'';function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saveMessage').textContent='保存済み（この端末内）'}catch(e){$('saveMessage').textContent='保存に失敗しました。バックアップを作成してください。'}}try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.projects))state=old}catch(e){}function update(){persist();render()};function project(){return state.projects.find(p=>p.id===selected)};function taskBy(id){return project()?.tasks.find(t=>t.id===id)};function brandOptions(){const old=$('brandFilter').value;const brands=[...new Set(state.projects.map(p=>p.brand))].sort();$('brandFilter').innerHTML='<option value="">全ブランド</option>'+brands.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');$('brandFilter').value=brands.includes(old)?old:''}
function render(){brandOptions();const query=$('search').value.toLowerCase(),b=$('brandFilter').value,f=$('statusFilter').value;const filtered=state.projects.filter(p=>(!b||p.brand===b)&&[p.brand,p.code,p.name].join(' ').toLowerCase().includes(query)&&(f==='all'||p.tasks.some(t=>!t.done&&(f==='mine'?!t.waiting:t.waiting))));$('projects').innerHTML=filtered.length?filtered.map(p=>{const open=selected===p.id;const mine=p.tasks.filter(t=>!t.done&&!t.waiting).length,wait=p.tasks.filter(t=>!t.done&&t.waiting).length;return `<div class="card ${open?'selected':''}"><button style="display:block;width:100%;text-align:left;border:0;padding:0" data-action="select" data-id="${p.id}"><div class="row between"><strong>${esc(p.brand)}｜${esc(p.name)}</strong><span>${open?'⌄':'›'}</span></div><div class="row" style="margin-top:8px;flex-wrap:wrap"><small>${esc(p.code||'品番未設定')}</small><span class="pill">${mine} 作業</span><span class="pill wait">${wait} 相手待ち</span></div></button>${open?renderDetail(p):''}</div>`}).join(''):'<p class="message">該当する案件はありません。</p>'}
function renderDetail(p){return `<div style="margin-top:16px"><div class="toolbar"><button data-action="editProject" data-id="${p.id}">案件編集</button><button data-action="share" data-id="${p.id}">📷 この品番を共有表示</button></div>${p.tasks.map(t=>`<div class="task"><div class="taskname"><input type="checkbox" aria-label="${esc(t.name)}を完了" data-action="toggle" data-id="${t.id}" ${t.done?'checked':''}><div class="grow"><div class="${t.done?'done':''}">${esc(t.name)}</div>${t.done?`<div class="status muted">完了：${esc(fmt(t.completedAt)||'日時未登録')}</div>`:`<div class="status">${t.waiting?'<span class="pill wait">相手待ち</span>':'<span class="pill">自分の作業</span>'}${t.due?` <span class="muted">期限：${esc(t.due)}</span>`:''}</div>`}</div><button data-action="editTask" data-id="${t.id}" aria-label="タスク編集">✎</button></div>${editTask===t.id?`<div class="stack" style="margin-top:10px"><label>タスク名</label><input id="taskEditName" value="${esc(t.name)}"><label>状態</label><select id="taskEditStatus"><option value="mine" ${!t.done&&!t.waiting?'selected':''}>自分の作業</option><option value="waiting" ${!t.done&&t.waiting?'selected':''}>相手待ち</option><option value="done" ${t.done?'selected':''}>完了</option></select><label>期限</label><input type="date" id="taskEditDue" value="${esc(t.due||'')}"><label>完了日時（過去の発送日などは修正できます）</label><input type="datetime-local" id="taskEditCompleted" value="${esc(t.completedAt||'')}"><div class="toolbar"><button data-action="saveTask" data-id="${t.id}" class="primary">変更を保存</button><button data-action="deleteTask" data-id="${t.id}" class="danger">削除</button><button data-action="closeTask">閉じる</button></div></div>`:''}</div>`).join('')}<div style="background:#f8fafc;padding:12px;border-radius:12px;margin-top:12px"><h3>＋ タスク追加</h3><label>タスク名</label><input id="newTask" placeholder="例：2ndサンプル発送"><label>状態</label><select id="newStatus"><option value="mine">自分の作業</option><option value="waiting">相手待ち</option></select><label>期限（任意）</label><input type="date" id="newDue"><button class="primary" style="width:100%;margin-top:12px" data-action="addTask">タスクを追加</button></div></div>`}
function share(id){sharing=id;const p=state.projects.find(x=>x.id===id);if(!p)return;$('appView').style.display='none';$('shareView').style.display='block';$('shareContent').innerHTML=`<h2 style="font-size:21px;margin:0">${esc(p.name)}</h2><p class="muted" style="margin:5px 0 16px">${esc(p.brand)}｜${esc(p.code)}</p><hr style="border:0;border-top:1px solid #e2e8f0">${p.tasks.map(t=>`<div class="shareitem"><span class="mark">${t.done?'☑':t.waiting?'◷':'○'}</span><div class="grow"><div class="${t.done?'done':''}">${esc(t.name)}</div><div class="status muted">${t.done?'完了：'+esc(fmt(t.completedAt)||'日時未登録'):t.waiting?'相手待ち':'自分の作業'}${!t.done&&t.due?' ｜期限：'+esc(t.due):''}</div></div></div>`).join('')||'<p>タスク未登録</p>'}`;window.scrollTo(0,0)}
$('back').onclick=()=>{$('shareView').style.display='none';$('appView').style.display='block';sharing=null};$('addProject').onclick=()=>{editProject=null;$('projectFormTitle').textContent='新しい案件';['brand','code','projectName'].forEach(id=>$(id).value='');$('projectForm').classList.remove('hidden')};$('cancelProject').onclick=()=>$('projectForm').classList.add('hidden');$('saveProject').onclick=()=>{const brand=$('brand').value.trim(),code=$('code').value.trim(),name=$('projectName').value.trim();if(!brand||!name)return alert('取引先と案件名を入力してください');if(editProject){const p=state.projects.find(p=>p.id===editProject);if(p)Object.assign(p,{brand,code,name})}else{const id=uid();state.projects.unshift({id,brand,code,name,tasks:[]});selected=id}$('projectForm').classList.add('hidden');$('brandFilter').value='';$('search').value='';$('statusFilter').value='all';update()};['search','brandFilter','statusFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('projects').addEventListener('change',e=>{const x=e.target;if(x.dataset.action==='toggle'){const t=taskBy(x.dataset.id);if(t){t.done=x.checked;t.completedAt=x.checked?nowLocal():'';if(x.checked)t.waiting=false;update()}}});$('projects').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.tagName==='INPUT')return;const a=el.dataset.action,id=el.dataset.id,p=project();if(a==='select'){selected=selected===id?null:id;editTask=null;render()}if(a==='share')share(id);if(a==='editProject'){editProject=id;const item=state.projects.find(p=>p.id===id);$('brand').value=item.brand;$('code').value=item.code;$('projectName').value=item.name;$('projectFormTitle').textContent='案件を編集';$('projectForm').classList.remove('hidden');window.scrollTo(0,0)}if(a==='addTask'){const name=$('newTask').value.trim();if(!name)return alert('タスク名を入力してください');p.tasks.push({id:uid(),name,done:false,waiting:$('newStatus').value==='waiting',due:$('newDue').value,completedAt:''});update()}if(a==='editTask'){editTask=editTask===id?null:id;render()}if(a==='closeTask'){editTask=null;render()}if(a==='saveTask'){const t=taskBy(id),name=$('taskEditName').value.trim(),s=$('taskEditStatus').value;if(!name)return alert('タスク名を入力してください');const wasDone=t.done;t.name=name;t.due=$('taskEditDue').value;t.done=s==='done';t.waiting=s==='waiting';t.completedAt=t.done?($('taskEditCompleted').value||(wasDone?t.completedAt:nowLocal())):'';editTask=null;update()}if(a==='deleteTask'){if(confirm('このタスクを削除しますか？')){p.tasks=p.tasks.filter(t=>t.id!==id);editTask=null;update()}}});$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='案件進捗バックアップ-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.projects)||!obj.projects.every(p=>typeof p.brand==='string'&&typeof p.name==='string'&&Array.isArray(p.tasks)))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;state={projects:obj.projects.map(p=>({...p,id:String(p.id),tasks:p.tasks.map(t=>({...t,id:String(t.id)}))}))};selected=null;update();alert('復元しました')}catch(err){alert('読み込めませんでした：'+err.message)}finally{e.target.value=''}};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
